<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>template-test-20</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FF1493"><link rel="apple-touch-icon" href="icon.svg"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#050507] text-white min-h-screen">
<div class="sticky top-0 z-50 backdrop-blur-xl bg-black/60 border-b border-white/10 p-4 flex justify-between"><div class="font-black tracking-widest">TEMPLATE-TEST-20 👑</div><div class="flex gap-2"><button id="walletBtn" onclick="connectWallet()" class="px-3 py-1 rounded-full bg-white/10 text-xs">🦊 Connect Wallet</button><span class="text- bg-white/10 px-2 py-1 rounded-full">🇺🇸 EN</span></div></div>
<div class="max-w-2xl mx-auto p-6 text-center mt-10"><h1 class="text-4xl font-black bg-gradient-to-r from-pink-500 to-cyan-400 bg-clip-text text-transparent">Welcome to template-test-20</h1><p class="text-white/50 mt-3">This is your MASTER TEMPLATE with PWA, Wallet, Menu, Comments, Versions</p><div class="mt-8 grid grid-cols-2 gap-3 text-sm"><div class="bg-white/5 p-4 rounded-2xl">✅ PWA Ready</div><div class="bg-white/5 p-4 rounded-2xl">✅ Wallet Connect</div><div class="bg-white/5 p-4 rounded-2xl">✅ Version Switcher</div><div class="bg-white/5 p-4 rounded-2xl">✅ Render Ready</div></div></div>
<div class="max-w-2xl mx-auto p-4 mt-6 border-t border-white/10"><h3 class="font-black mb-3">💬 Comments</h3><div class="flex gap-2"><input id="cText" placeholder="Your comment..." class="flex-1 p-3 rounded-xl bg-white/5 border border-white/10"><button onclick="addComment()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 font-bold">Send</button></div><div id="cList" class="mt-4 space-y-2"></div></div>
<div class="fixed bottom-0 left-0 right-0 backdrop-blur-2xl bg-black/80 border-t border-white/10 flex justify-around p-3"><button class="flex flex-col items-center text-">🏠 Home</button><button class="flex flex-col items-center text-">📱 Apps</button><button onclick="connectWallet()" class="flex flex-col items-center text-">👛 Wallet</button><button class="flex flex-col items-center text-">⚙️ Settings</button></div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
async function connectWallet(){ if(window.ethereum){ const a=await window.ethereum.request({method:'eth_requestAccounts'}); document.getElementById('walletBtn').innerText=a[0].slice(0,6)+'...'+a[0].slice(-4)+' ✅'; localStorage.setItem('wallet',a[0]); } else { alert('Install MetaMask / Trust Wallet'); } }
function loadC(){ const cs=JSON.parse(localStorage.getItem('comments')||'[]'); document.getElementById('cList').innerHTML=cs.map(c=>`<div class="bg-white/5 p-3 rounded-xl text-sm">${c}</div>`).join(''); }
function addComment(){ const t=document.getElementById('cText').value; if(!t) return; const cs=JSON.parse(localStorage.getItem('comments')||'[]'); cs.unshift(t); localStorage.setItem('comments',JSON.stringify(cs)); document.getElementById('cText').value=''; loadC(); } loadC();
</script></body></html>
